<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<defs>
		<linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
			<stop offset="0" stop-color="#120d26" />
			<stop offset="1" stop-color="#3a2a5e" />
		</linearGradient>
		<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff1c4" />
			<stop offset="0.45" stop-color="#ffc46b" />
			<stop offset="1" stop-color="#ff7a3d" />
		</linearGradient>
		<clipPath id="tile">
			<rect width="64" height="64" rx="14" />
		</clipPath>
	</defs>
	<g clip-path="url(#tile)">
		<rect width="64" height="64" fill="url(#sky)" />
		<circle cx="32" cy="36" r="20" fill="url(#sun)" />
		<!-- Sunset bands cut through the lower half, like the hero's sun sinking into the sea. -->
		<g fill="url(#sky)">
			<rect y="38" width="64" height="2.5" />
			<rect y="44" width="64" height="3.5" />
			<rect y="51" width="64" height="13" />
		</g>
	</g>
</svg>
